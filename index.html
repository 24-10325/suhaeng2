<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Outfit', 'Malgun Gothic', sans-serif;
  background: #0f1117;
  color: #e8eaf6;
  min-height: 100vh;
}

/* ─── HEADER ─── */
.header {
  padding: 18px 28px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(255,255,255,0.02);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mine { font-size: 1.5rem; display: inline-block; animation: sway 3s infinite; }
@keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
.logo-text {
  font-size: 1.4rem; font-weight: 800;
  background: linear-gradient(90deg,#5b7cff,#7c5bff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ─── MODE SECTION ─── */
#modeSection {
  max-width: 820px;
  margin: 40px auto;
  padding: 0 20px;
}
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media(max-width:600px){ .mode-grid{ grid-template-columns:1fr; } }
.mode-card {
  background: #1e2235;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 26px 22px;
}
.mode-card.ta-card {
  background: linear-gradient(135deg,#1e2235,#25211a);
  border-color: rgba(246,201,14,0.2);
}
.mode-card h2 { font-size: 1.15rem; font-weight: 700; margin: 8px 0 6px; }
.mode-card p  { font-size: 0.82rem; color: #9195b0; margin-bottom: 14px; }
.mode-icon { font-size: 1.8rem; }

.diff-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 11px 14px;
  margin-bottom: 8px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.07);
  background: #22263a;
  color: #e8eaf6;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.88rem;
  transition: all 0.15s;
  text-align: left;
}
.diff-btn:hover { background: #5b7cff; border-color: #5b7cff; transform: translateX(4px); }
.diff-btn.ta-btn:hover { background: #f6c90e; border-color: #f6c90e; color: #1a1500; }
.diff-btn .name { font-weight: 700; }
.diff-btn .info { font-size: 0.75rem; color: #9195b0; }
.diff-btn:hover .info { color: rgba(255,255,255,0.75); }
.diff-btn.ta-btn:hover .info { color: rgba(30,20,0,0.7); }

/* ─── GAME SECTION ─── */
#gameSection { display: none; flex-direction: column; align-items: center; padding: 20px 16px 40px; gap: 14px; }
#gameSection.show { display: flex; }

/* top bar */
.topbar {
  width: 100%;
  max-width: 1100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1e2235;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 10px 16px;
  gap: 10px;
  flex-wrap: wrap;
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; flex: 1; }
.topbar-right { justify-content: flex-end; }
.topbar-center { display: flex; align-items: center; gap: 16px; }

.back-btn {
  background: #22263a; border: 1px solid rgba(255,255,255,0.07);
  color: #9195b0; padding: 7px 13px; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 0.83rem;
  transition: all 0.15s;
}
.back-btn:hover { color: #e8eaf6; background: #0f1117; }

.badge {
  background: linear-gradient(90deg,#5b7cff,#7c5bff);
  color: #fff; padding: 4px 12px; border-radius: 20px;
  font-size: 0.75rem; font-weight: 700;
}

.stat-box {
  display: flex; align-items: center; gap: 6px;
  background: #22263a; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px; padding: 7px 14px; min-width: 68px; justify-content: center;
}
.stat-val { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-val { color: #22d3ee; }

.face-btn {
  width: 46px; height: 46px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  background: #22263a; font-size: 1.3rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.face-btn:hover { transform: rotate(20deg) scale(1.1); background: #5b7cff; border-color: #5b7cff; }

.hint-btn {
  background: #2a2800; border: 1px solid rgba(246,201,14,0.35);
  color: #f6c90e; padding: 7px 14px; border-radius: 10px;
  cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 700;
  transition: all 0.15s;
}
.hint-btn:hover { background: #3a3600; box-shadow: 0 4px 14px rgba(246,201,14,0.2); }
.hint-penalty { font-size: 0.7rem; font-weight: 400; opacity: 0.75; }

/* time attack bar */
.ta-bar {
  width: 100%; max-width: 1100px;
  background: #1e2235; border: 1px solid rgba(246,201,14,0.18);
  border-radius: 12px; padding: 10px 18px;
  display: none; align-items: center; gap: 14px;
}
.ta-bar.show { display: flex; }
.ta-label { font-size: 0.78rem; color: #f6c90e; font-weight: 700; white-space: nowrap; }
.ta-track { flex: 1; height: 10px; background: #22263a; border-radius: 999px; overflow: hidden; }
.ta-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg,#22c55e,#f6c90e);
  border-radius: 999px; transition: width 0.5s linear;
}
.ta-fill.warn { background: linear-gradient(90deg,#f6c90e,#ff8c00); }
.ta-fill.danger { background: linear-gradient(90deg,#ff4f5e,#ff8c00); }
.ta-sec { font-size: 1rem; font-weight: 700; color: #f6c90e; min-width: 36px; text-align: right; }

/* ─── BOARD ─── */
.board-scroll { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
.board-outer {
  background: #1e2235; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px; padding: 12px; display: inline-block;
}
#board {
  display: grid;
  gap: 3px;
}

/* ─── CELLS ─── */
.cell {
  width: 36px; height: 36px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.88rem; font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform 0.1s, background 0.12s;
  user-select: none;
}
.cell.covered {
  background: #22263a;
  border-color: rgba(255,255,255,0.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.cell.covered:hover {
  background: #2e3450; border-color: #5b7cff;
  transform: scale(1.1); z-index: 2; position: relative;
}
.cell.flagged {
  background: #2a1a1a; border-color: rgba(255,79,94,0.35);
}
.cell.open {
  background: #1a1d27; border-color: rgba(255,255,255,0.04);
  cursor: default;
}
.cell.open:hover { transform: none; }
.cell.chord-ready { background: #1e2540; border-color: rgba(91,124,255,0.55); cursor: pointer; }

.cell.mine-explode {
  background: radial-gradient(circle,#ff3030,#8b0000);
  border-color: #ff4f5e;
  animation: boom 0.4s ease-out;
}
.cell.mine-show { background: #2a1a1a; border-color: rgba(255,79,94,0.2); cursor: default; }

@keyframes boom { 0%{transform:scale(1.5)} 60%{transform:scale(0.9)} 100%{transform:scale(1)} }
@keyframes pop  { 0%{transform:scale(0.8);opacity:0.4} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
@keyframes glow { 0%{box-shadow:0 0 0 0 rgba(246,201,14,0.9)} 70%{box-shadow:0 0 0 10px rgba(246,201,14,0)} 100%{box-shadow:none} }

.cell.chord-pop { animation: pop 0.22s ease-out; }
.cell.hint-glow { animation: glow 0.65s ease-out; }

/* number colors */
.n1{color:#5b7cff} .n2{color:#22c55e} .n3{color:#ff4f5e}
.n4{color:#7c5bff} .n5{color:#ff8c00} .n6{color:#22d3ee}
.n7{color:#ec4899} .n8{color:#9195b0}

/* ─── FOOTER HINT ─── */
.footer-hint {
  font-size: 0.78rem; color: #555a7a;
  background: #1a1d27; border: 1px solid rgba(255,255,255,0.05);
  border-radius: 8px; padding: 7px 16px;
  max-width: 1100px; width: 100%; text-align: center;
}

/* ─── RESULT MODAL ─── */
#resultModal {
  display: none; position: fixed; inset: 0;
  background: rgba(5,7,15,0.88); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; z-index: 999;
}
#resultModal.show { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.result-box {
  background: #1e2235; border: 1px solid rgba(255,255,255,0.09);
  border-radius: 22px; padding: 38px 46px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  min-width: 300px; animation: slideUp 0.3s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
@keyframes slideUp { from{transform:translateY(28px) scale(0.96);opacity:0} to{transform:none;opacity:1} }

.result-emoji { font-size: 3.2rem; animation: bounceY 0.5s ease; }
@keyframes bounceY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.result-title { font-size: 1.7rem; font-weight: 800; }
.result-sub { color: #9195b0; font-size: 0.9rem; text-align: center; }

.result-stats {
  display: flex; gap: 22px;
  background: #22263a; border-radius: 12px;
  padding: 14px 22px; border: 1px solid rgba(255,255,255,0.07);
}
.rstat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.rstat-label { font-size: 0.74rem; color: #9195b0; }
.rstat-val   { font-size: 1.2rem; font-weight: 700; }

.result-btns { display: flex; gap: 10px; }
.rbtn {
  padding: 11px 26px; border-radius: 10px; border: none;
  cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 700;
  transition: all 0.15s;
}
.rbtn.primary { background: linear-gradient(135deg,#5b7cff,#7c5bff); color: #fff; }
.rbtn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(91,124,255,0.4); }
.rbtn.secondary {
  background: #22263a; color: #9195b0;
  border: 1px solid rgba(255,255,255,0.07);
}
.rbtn.secondary:hover { color: #e8eaf6; }

/* flash */
@keyframes flashRed   { 0%{background:rgba(255,79,94,0.25)}  100%{background:transparent} }
@keyframes flashGreen { 0%{background:rgba(34,197,94,0.25)}  100%{background:transparent} }
.flash-red   { animation: flashRed   0.5s ease; }
.flash-green { animation: flashGreen 0.5s ease; }

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0f1117}
::-webkit-scrollbar-thumb{background:#22263a;border-radius:3px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="logo-mine">💣</span>
  <span class="logo-text">지뢰찾기</span>
</div>

<!-- MODE SELECTION -->
<div id="modeSection">
  <div class="mode-grid">

    <!-- Normal -->
    <div class="mode-card">
      <div class="mode-icon">🎯</div>
      <h2>일반 모드</h2>
      <p>제한 시간 없이 클리어하세요</p>
      <button class="diff-btn" onclick="startGame('normal','easy')">
        <span class="name">초급</span>
        <span class="info">9×9 · 지뢰 10</span>
      </button>
      <button class="diff-btn" onclick="startGame('normal','medium')">
        <span class="name">중급</span>
        <span class="info">16×16 · 지뢰 40</span>
      </button>
      <button class="diff-btn" onclick="startGame('normal','hard')">
        <span class="name">상급</span>
        <span class="info">30×16 · 지뢰 99</span>
      </button>
    </div>

    <!-- Time Attack -->
    <div class="mode-card ta-card">
      <div class="mode-icon">⚡</div>
      <h2>타임어택</h2>
      <p>제한 시간 안에 클리어하세요!</p>
      <button class="diff-btn ta-btn" onclick="startGame('ta','easy')">
        <span class="name">초급</span>
        <span class="info">9×9 · 지뢰 10 · <b>10초</b></span>
      </button>
      <button class="diff-btn ta-btn" onclick="startGame('ta','medium')">
        <span class="name">중급</span>
        <span class="info">16×16 · 지뢰 40 · <b>40초</b></span>
      </button>
      <button class="diff-btn ta-btn" onclick="startGame('ta','hard')">
        <span class="name">상급</span>
        <span class="info">30×16 · 지뢰 99 · <b>100초</b></span>
      </button>
    </div>

  </div>
</div>

<!-- GAME SECTION -->
<div id="gameSection">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="goMenu()">← 메뉴</button>
      <span class="badge" id="badge"></span>
    </div>
    <div class="topbar-center">
      <div class="stat-box">
        <span>💣</span>
        <span class="stat-val" id="mineDisp">0</span>
      </div>
      <button class="face-btn" id="faceBtn" onclick="restartGame()">😊</button>
      <div class="stat-box" id="timerBox">
        <span>⏱</span>
        <span class="stat-val timer-val" id="timerDisp">0</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="hint-btn" onclick="useHint()">
        💡 힌트 <span class="hint-penalty" id="hintPen"></span>
      </button>
    </div>
  </div>

  <!-- Time-attack bar -->
  <div class="ta-bar" id="taBar">
    <span class="ta-label">남은 시간</span>
    <div class="ta-track"><div class="ta-fill" id="taFill"></div></div>
    <span class="ta-sec" id="taSec">0</span>
  </div>

  <!-- Board -->
  <div class="board-scroll">
    <div class="board-outer">
      <div id="board"></div>
    </div>
  </div>

  <!-- Footer hint -->
  <div class="footer-hint">
    💡 <b>화음</b>: 숫자 칸 주변 깃발이 숫자와 같으면 <b>클릭 한 번</b>으로 나머지 칸이 열립니다
    &nbsp;|&nbsp; 우클릭으로 깃발 🚩
  </div>
</div>

<!-- RESULT MODAL -->
<div id="resultModal">
  <div class="result-box">
    <div class="result-emoji" id="resEmoji"></div>
    <div class="result-title" id="resTitle"></div>
    <div class="result-sub"   id="resSub"></div>
    <div class="result-stats">
      <div class="rstat"><span class="rstat-label">시간</span><span class="rstat-val" id="resTime"></span></div>
      <div class="rstat"><span class="rstat-label">힌트 사용</span><span class="rstat-val" id="resHints"></span></div>
    </div>
    <div class="result-btns">
      <button class="rbtn primary"    onclick="restartGame(); closeModal()">다시 도전</button>
      <button class="rbtn secondary"  onclick="goMenu();      closeModal()">메뉴로</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
//  CONFIG
// ────────────────────────────────────────────────
var CFG = {
  easy:   { rows:9,  cols:9,  mines:10 },
  medium: { rows:16, cols:16, mines:40 },
  hard:   { rows:16, cols:30, mines:99 }
};
var TIME_LIMIT = { easy:10, medium:40, hard:100 };

// ────────────────────────────────────────────────
//  STATE
// ────────────────────────────────────────────────
var G = {};   // game state

function resetState(mode, level) {
  var cfg = CFG[level];
  G = {
    mode:       mode,
    level:      level,
    rows:       cfg.rows,
    cols:       cfg.cols,
    totalMines: cfg.mines,
    flagCount:  0,
    grid:       [],       // grid[r][c] = { mine, revealed, flagged, adj }
    status:     'idle',   // idle | playing | won | lost
    first:      true,
    elapsed:    0,
    remaining:  (mode === 'ta') ? TIME_LIMIT[level] : 0,
    timeLimit:  TIME_LIMIT[level],
    hintCount:  0,
    ticker:     null
  };
}

// ────────────────────────────────────────────────
//  DOM helpers
// ────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }

function cellEl(r, c) {
  return el('board').querySelector('[data-r="'+r+'"][data-c="'+c+'"]');
}

// ────────────────────────────────────────────────
//  NAVIGATION
// ────────────────────────────────────────────────
function goMenu() {
  stopTicker();
  el('modeSection').style.display = '';
  el('gameSection').className = '';   // remove 'show'
}

function closeModal() {
  el('resultModal').className = '';
}

// ────────────────────────────────────────────────
//  START / RESTART
// ────────────────────────────────────────────────
function startGame(mode, level) {
  stopTicker();
  resetState(mode, level);

  // show game section, hide menu
  el('modeSection').style.display = 'none';
  el('gameSection').className = 'show';
  el('resultModal').className = '';

  // badge & hint label
  var lvNames = { easy:'초급', medium:'중급', hard:'상급' };
  var mLabel  = (mode === 'ta') ? '⚡ 타임어택' : '🎯 일반';
  el('badge').textContent = mLabel + ' · ' + lvNames[level];
  el('hintPen').textContent = (mode === 'ta') ? '(-10초)' : '(+10초)';

  // timer / TA bar
  if (mode === 'ta') {
    el('timerBox').style.display = 'none';
    el('taBar').className = 'ta-bar show';
    refreshTABar();
  } else {
    el('timerBox').style.display = '';
    el('taBar').className = 'ta-bar';
    el('timerDisp').textContent = '0';
  }

  el('faceBtn').textContent = '😊';
  G.hintCount = 0;
  refreshMineCount();
  buildGrid();
  buildDOM();
}

function restartGame() {
  startGame(G.mode, G.level);
}

// ────────────────────────────────────────────────
//  BUILD GRID (data only, no mines yet)
// ────────────────────────────────────────────────
function buildGrid() {
  G.grid = [];
  for (var r = 0; r < G.rows; r++) {
    G.grid[r] = [];
    for (var c = 0; c < G.cols; c++) {
      G.grid[r][c] = { mine:false, revealed:false, flagged:false, adj:0 };
    }
  }
}

// ────────────────────────────────────────────────
//  BUILD DOM
// ────────────────────────────────────────────────
function buildDOM() {
  var board = el('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = 'repeat(' + G.cols + ', 36px)';
  board.style.display = 'grid';
  board.style.gap = '3px';

  for (var r = 0; r < G.rows; r++) {
    for (var c = 0; c < G.cols; c++) {
      var div = document.createElement('div');
      div.className = 'cell covered';
      div.setAttribute('data-r', r);
      div.setAttribute('data-c', c);
      div.addEventListener('click',       makeLClick(r, c));
      div.addEventListener('contextmenu', makeRClick(r, c));
      board.appendChild(div);
    }
  }
}

function makeLClick(r, c) {
  return function(e) { e.preventDefault(); onLeftClick(r, c); };
}
function makeRClick(r, c) {
  return function(e) { e.preventDefault(); onRightClick(r, c); };
}

// ────────────────────────────────────────────────
//  MINE PLACEMENT (first click safety)
// ────────────────────────────────────────────────
function placeMines(safeR, safeC) {
  // safe zone: 3×3 around first click
  var safe = {};
  for (var dr = -1; dr <= 1; dr++)
    for (var dc = -1; dc <= 1; dc++) {
      var nr = safeR+dr, nc = safeC+dc;
      if (nr>=0 && nr<G.rows && nc>=0 && nc<G.cols)
        safe[nr+','+nc] = true;
    }

  var pool = [];
  for (var r = 0; r < G.rows; r++)
    for (var c = 0; c < G.cols; c++)
      if (!safe[r+','+c]) pool.push([r,c]);

  // shuffle
  for (var i = pool.length-1; i > 0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  for (var m = 0; m < G.totalMines; m++) {
    G.grid[pool[m][0]][pool[m][1]].mine = true;
  }

  // compute adj
  for (var r2 = 0; r2 < G.rows; r2++)
    for (var c2 = 0; c2 < G.cols; c2++)
      if (!G.grid[r2][c2].mine)
        G.grid[r2][c2].adj = countAdj(r2, c2);
}

function countAdj(r, c) {
  var n = 0;
  eachNeighbor(r, c, function(nr, nc) { if (G.grid[nr][nc].mine) n++; });
  return n;
}

// ────────────────────────────────────────────────
//  CLICK HANDLERS
// ────────────────────────────────────────────────
function onLeftClick(r, c) {
  if (G.status === 'won' || G.status === 'lost') return;
  var cell = G.grid[r][c];
  if (cell.flagged) return;

  // first click
  if (G.first) {
    G.first = false;
    G.status = 'playing';
    placeMines(r, c);
    startTicker();
  }

  if (cell.revealed) {
    tryChord(r, c);
    return;
  }

  reveal(r, c);
  checkWin();
}

function onRightClick(r, c) {
  if (G.status === 'won' || G.status === 'lost') return;
  if (!G.first && G.status === 'idle') return;
  var cell = G.grid[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  G.flagCount += cell.flagged ? 1 : -1;
  paintCell(r, c);
  refreshMineCount();
}

// ────────────────────────────────────────────────
//  CHORD (single left-click on open number)
// ────────────────────────────────────────────────
function tryChord(r, c) {
  var cell = G.grid[r][c];
  if (!cell.revealed || cell.adj === 0) return;

  var flags = 0;
  eachNeighbor(r, c, function(nr, nc) { if (G.grid[nr][nc].flagged) flags++; });
  if (flags !== cell.adj) return;

  var hitMine = false;
  eachNeighbor(r, c, function(nr, nc) {
    var nb = G.grid[nr][nc];
    if (!nb.revealed && !nb.flagged) {
      if (nb.mine) {
        hitMine = true;
        nb.revealed = true;
        var div = cellEl(nr, nc);
        div.className = 'cell mine-explode';
        div.textContent = '💣';
      } else {
        reveal(nr, nc, true);
      }
    }
  });

  if (hitMine) { endGame(false); } else { checkWin(); }
}

// ────────────────────────────────────────────────
//  REVEAL (recursive flood-fill)
// ────────────────────────────────────────────────
function reveal(r, c, chordAnim) {
  var cell = G.grid[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true;

  if (cell.mine) {
    var div = cellEl(r, c);
    div.className = 'cell mine-explode';
    div.textContent = '💣';
    endGame(false);
    return;
  }

  paintCell(r, c, chordAnim);

  if (cell.adj === 0) {
    eachNeighbor(r, c, function(nr, nc) { reveal(nr, nc); });
  }
}

// ────────────────────────────────────────────────
//  PAINT CELL
// ────────────────────────────────────────────────
var NUM_CLASS = ['','n1','n2','n3','n4','n5','n6','n7','n8'];

function paintCell(r, c, chordAnim) {
  var cell = G.grid[r][c];
  var div  = cellEl(r, c);
  if (!div) return;

  if (cell.revealed) {
    var cls = 'cell open';
    if (chordAnim) cls += ' chord-pop';
    if (cell.adj > 0) cls += ' ' + NUM_CLASS[cell.adj];
    div.className   = cls;
    div.textContent = cell.adj > 0 ? cell.adj : '';
  } else if (cell.flagged) {
    div.className   = 'cell flagged';
    div.textContent = '🚩';
  } else {
    div.className   = 'cell covered';
    div.textContent = '';
  }
}

// ────────────────────────────────────────────────
//  WIN CHECK
// ────────────────────────────────────────────────
function checkWin() {
  for (var r = 0; r < G.rows; r++)
    for (var c = 0; c < G.cols; c++)
      if (!G.grid[r][c].mine && !G.grid[r][c].revealed) return;
  endGame(true);
}

// ────────────────────────────────────────────────
//  END GAME
// ────────────────────────────────────────────────
function endGame(won) {
  stopTicker();
  G.status = won ? 'won' : 'lost';
  el('faceBtn').textContent = won ? '😎' : '😵';

  if (!won) {
    // reveal all mines
    for (var r = 0; r < G.rows; r++)
      for (var c = 0; c < G.cols; c++) {
        var cell = G.grid[r][c];
        if (cell.mine && !cell.flagged) {
          var div = cellEl(r, c);
          div.className   = 'cell mine-show';
          div.textContent = '💣';
        }
      }
  }

  setTimeout(showResult, won ? 600 : 900);
}

function showResult() {
  var lvNames = { easy:'초급', medium:'중급', hard:'상급' };
  var emoji, title, sub;

  if (G.status === 'won') {
    emoji = '🎉'; title = '클리어!';
    sub = (G.mode === 'ta')
      ? '타임어택 성공! ' + G.remaining + '초 남았습니다.'
      : lvNames[G.level] + ' 모드 클리어!';
  } else if (G.mode === 'ta' && G.remaining <= 0) {
    emoji = '⏰'; title = '시간 초과!';
    sub = '제한 시간 안에 클리어하지 못했습니다.';
  } else {
    emoji = '💥'; title = '지뢰 폭발!';
    sub = '지뢰를 밟았습니다. 다시 도전해보세요!';
  }

  el('resEmoji').textContent  = emoji;
  el('resTitle').textContent  = title;
  el('resSub').textContent    = sub;

  var elapsed = (G.mode === 'ta') ? (G.timeLimit - G.remaining) : G.elapsed;
  el('resTime').textContent   = elapsed + '초';
  el('resHints').textContent  = G.hintCount + '회';

  el('resultModal').className = 'show';
}

// ────────────────────────────────────────────────
//  HINT
// ────────────────────────────────────────────────
function useHint() {
  if (G.status !== 'playing') return;

  // collect safe covered cells adjacent to any revealed cell
  var seen = {};
  var cands = [];
  for (var r = 0; r < G.rows; r++) {
    for (var c = 0; c < G.cols; c++) {
      if (!G.grid[r][c].revealed) continue;
      eachNeighbor(r, c, function(nr, nc) {
        var k = nr + ',' + nc;
        if (!seen[k] && !G.grid[nr][nc].revealed && !G.grid[nr][nc].flagged && !G.grid[nr][nc].mine) {
          seen[k] = true;
          cands.push([nr, nc]);
        }
      });
    }
  }
  if (cands.length === 0) return;

  var pick = cands[Math.floor(Math.random() * cands.length)];
  var hr = pick[0], hc = pick[1];

  G.hintCount++;
  reveal(hr, hc);

  // glow animation
  var hdiv = cellEl(hr, hc);
  if (hdiv) {
    hdiv.classList.add('hint-glow');
    setTimeout(function() { if(hdiv) hdiv.classList.remove('hint-glow'); }, 700);
  }

  // time penalty
  if (G.mode === 'normal') {
    G.elapsed += 10;
    el('timerDisp').textContent = G.elapsed;
    flash(el('timerBox'), 'flash-green');
  } else {
    G.remaining = Math.max(0, G.remaining - 10);
    refreshTABar();
    flash(el('taBar'), 'flash-red');
    if (G.remaining <= 0) { endGame(false); return; }
  }

  checkWin();
}

// ────────────────────────────────────────────────
//  TIMER
// ────────────────────────────────────────────────
function startTicker() {
  stopTicker();
  G.ticker = setInterval(function() {
    if (G.mode === 'normal') {
      G.elapsed++;
      el('timerDisp').textContent = G.elapsed;
    } else {
      G.remaining--;
      refreshTABar();
      if (G.remaining <= 0) {
        G.remaining = 0;
        refreshTABar();
        endGame(false);
      }
    }
  }, 1000);
}

function stopTicker() {
  if (G.ticker) { clearInterval(G.ticker); G.ticker = null; }
}

function refreshTABar() {
  var pct = G.timeLimit > 0 ? G.remaining / G.timeLimit : 0;
  el('taFill').style.width = Math.round(pct * 100) + '%';
  el('taSec').textContent  = G.remaining;
  el('taFill').className   = 'ta-fill' + (pct <= 0.25 ? ' danger' : pct <= 0.5 ? ' warn' : '');
}

function refreshMineCount() {
  el('mineDisp').textContent = G.totalMines - G.flagCount;
}

// ────────────────────────────────────────────────
//  CHORD HOVER HIGHLIGHT
// ────────────────────────────────────────────────
el('board').addEventListener('mouseover', function(e) {
  var div = e.target;
  if (!div.classList.contains('cell') || !div.classList.contains('open')) return;
  var r = +div.getAttribute('data-r'), c = +div.getAttribute('data-c');
  if (!G.grid || !G.grid[r]) return;
  var cell = G.grid[r][c];
  if (cell.adj === 0) return;
  var flags = 0;
  eachNeighbor(r, c, function(nr, nc) { if (G.grid[nr][nc].flagged) flags++; });
  if (flags === cell.adj) div.classList.add('chord-ready');
});

el('board').addEventListener('mouseout', function(e) {
  var div = e.target;
  if (div && div.classList) div.classList.remove('chord-ready');
});

el('board').addEventListener('contextmenu', function(e) { e.preventDefault(); });

// ────────────────────────────────────────────────
//  UTILITIES
// ────────────────────────────────────────────────
function eachNeighbor(r, c, fn) {
  for (var dr = -1; dr <= 1; dr++)
    for (var dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      var nr = r+dr, nc = c+dc;
      if (nr >= 0 && nr < G.rows && nc >= 0 && nc < G.cols)
        fn(nr, nc);
    }
}

function flash(div, cls) {
  if (!div) return;
  div.classList.remove(cls);
  void div.offsetWidth;
  div.classList.add(cls);
  setTimeout(function(){ if(div) div.classList.remove(cls); }, 600);
}
</script>
