<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit','Malgun Gothic',sans-serif;
  background:#0f1117;
  color:#e8eaf6;
  min-height:100vh;
}

/* ── HEADER ── */
.hdr{
  padding:16px 28px;
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.02);
}
.hdr-mine{font-size:1.5rem;animation:sway 3s ease-in-out infinite;display:inline-block}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.hdr-title{
  font-size:1.4rem;font-weight:800;
  background:linear-gradient(90deg,#5b7cff,#a56dff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── SCREENS ── */
#screen-menu{padding:40px 20px}
#screen-game{display:none;flex-direction:column;align-items:center;padding:20px 16px 40px;gap:14px}

/* ── MENU CARDS ── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:820px;margin:0 auto}
@media(max-width:580px){.cards{grid-template-columns:1fr}}
.card{
  background:#1e2235;border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:26px 22px;
}
.card.ta{background:linear-gradient(135deg,#1e2235,#252010);border-color:rgba(246,201,14,.2)}
.card-icon{font-size:1.8rem}
.card h2{font-size:1.1rem;font-weight:700;margin:8px 0 5px}
.card p{font-size:.82rem;color:#9195b0;margin-bottom:14px}

.mbtn{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;padding:11px 14px;margin-bottom:8px;
  border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:#22263a;color:#e8eaf6;
  cursor:pointer;font-family:inherit;font-size:.88rem;
  transition:background .15s,transform .15s,border-color .15s;
  text-align:left;
}
.mbtn:hover{background:#5b7cff;border-color:#5b7cff;transform:translateX(4px)}
.mbtn.ta:hover{background:#f6c90e;border-color:#f6c90e;color:#1a1500}
.mbtn .mn{font-weight:700}
.mbtn .mi{font-size:.76rem;color:#9195b0}
.mbtn:hover .mi{color:rgba(255,255,255,.75)}
.mbtn.ta:hover .mi{color:rgba(30,20,0,.75)}

/* ── TOPBAR ── */
.topbar{
  width:100%;max-width:1200px;
  display:flex;align-items:center;justify-content:space-between;
  background:#1e2235;border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:10px 16px;gap:10px;flex-wrap:wrap;
}
.tb-l,.tb-r{display:flex;align-items:center;gap:10px;flex:1}
.tb-r{justify-content:flex-end}
.tb-c{display:flex;align-items:center;gap:14px}

.back-btn{
  background:#22263a;border:1px solid rgba(255,255,255,.07);
  color:#9195b0;padding:7px 13px;border-radius:8px;
  cursor:pointer;font-family:inherit;font-size:.83rem;transition:all .15s;
}
.back-btn:hover{color:#e8eaf6;background:#0f1117}

.badge{
  background:linear-gradient(90deg,#5b7cff,#a56dff);
  color:#fff;padding:4px 12px;border-radius:20px;
  font-size:.75rem;font-weight:700;
}

.sbox{
  display:flex;align-items:center;gap:6px;
  background:#22263a;border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:7px 14px;min-width:66px;justify-content:center;
}
.sval{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.tval{color:#22d3ee}

.face{
  width:46px;height:46px;border-radius:50%;
  border:2px solid rgba(255,255,255,.1);
  background:#22263a;font-size:1.3rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.face:hover{transform:rotate(18deg) scale(1.1);background:#5b7cff;border-color:#5b7cff}

.hbtn{
  background:#272500;border:1px solid rgba(246,201,14,.35);
  color:#f6c90e;padding:7px 14px;border-radius:10px;
  cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700;
  transition:all .15s;white-space:nowrap;
}
.hbtn:hover{background:#333000;box-shadow:0 4px 14px rgba(246,201,14,.2)}
.hpen{font-size:.7rem;font-weight:400;opacity:.75}

/* ── TA BAR ── */
.tabar{
  width:100%;max-width:1200px;
  background:#1e2235;border:1px solid rgba(246,201,14,.18);
  border-radius:12px;padding:10px 18px;
  display:none;align-items:center;gap:14px;
}
.ta-lbl{font-size:.78rem;color:#f6c90e;font-weight:700;white-space:nowrap}
.ta-track{flex:1;height:10px;background:#22263a;border-radius:999px;overflow:hidden}
.ta-fill{
  height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#22c55e,#f6c90e);
  transition:width .8s linear;
}
.ta-fill.w{background:linear-gradient(90deg,#f6c90e,#ff8c00)}
.ta-fill.d{background:linear-gradient(90deg,#ff4f5e,#ff8c00)}
.ta-sec{font-size:1rem;font-weight:700;color:#f6c90e;min-width:34px;text-align:right}

/* ── BOARD ── */
.bscroll{width:100%;overflow-x:auto;display:flex;justify-content:center}
.bouter{
  background:#1e2235;border:1px solid rgba(255,255,255,.07);
  border-radius:16px;padding:12px;display:inline-block;
}
#board{display:grid;gap:3px}

/* ── CELLS ── */
.cell{
  width:36px;height:36px;
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:.88rem;font-weight:700;
  cursor:pointer;
  border:1px solid transparent;
  user-select:none;
  transition:transform .1s,background .12s;
}
.cell.cov{
  background:#22263a;
  border-color:rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.cell.cov:hover{
  background:#2e3450;border-color:#5b7cff;
  transform:scale(1.1);z-index:2;position:relative;
}
.cell.flag{background:#2a1a1a;border-color:rgba(255,79,94,.35)}
.cell.flag:hover{transform:scale(1.08);border-color:#ff4f5e}
.cell.open{background:#1a1d27;border-color:rgba(255,255,255,.04);cursor:default}
.cell.open:hover{transform:none}
.cell.chord{background:#1e2540;border-color:rgba(91,124,255,.5);cursor:pointer}
.cell.boom{background:radial-gradient(circle,#ff3030,#8b0000);border-color:#ff4f5e;animation:xplo .4s}
.cell.mshow{background:#2a1a1a;border-color:rgba(255,79,94,.2);cursor:default}

@keyframes xplo{0%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.8);opacity:.4}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(246,201,14,.9)}70%{box-shadow:0 0 0 10px rgba(246,201,14,0)}100%{box-shadow:none}}

.cell.cpop{animation:pop .22s ease-out}
.cell.hglow{animation:glow .65s ease-out}

.n1{color:#5b7cff}.n2{color:#22c55e}.n3{color:#ff4f5e}
.n4{color:#a56dff}.n5{color:#ff8c00}.n6{color:#22d3ee}
.n7{color:#ec4899}.n8{color:#9195b0}

/* ── FOOTER ── */
.ftip{
  font-size:.78rem;color:#555a7a;
  background:#1a1d27;border:1px solid rgba(255,255,255,.05);
  border-radius:8px;padding:7px 16px;
  max-width:1200px;width:100%;text-align:center;
}

/* ── MODAL ── */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(5,7,15,.88);backdrop-filter:blur(8px);
  align-items:center;justify-content:center;z-index:999;
}
.modal.show{display:flex;animation:fin .3s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mbox{
  background:#1e2235;border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:38px 46px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  min-width:300px;animation:sUp .3s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
@keyframes sUp{from{transform:translateY(28px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.moji{font-size:3.2rem;animation:by .5s}
@keyframes by{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.mtitle{font-size:1.7rem;font-weight:800}
.msub{color:#9195b0;font-size:.9rem;text-align:center}
.mstats{
  display:flex;gap:22px;background:#22263a;
  border-radius:12px;padding:14px 22px;border:1px solid rgba(255,255,255,.07);
}
.ms{display:flex;flex-direction:column;align-items:center;gap:3px}
.mslbl{font-size:.74rem;color:#9195b0}
.msval{font-size:1.2rem;font-weight:700}
.mbtns{display:flex;gap:10px}
.mbtn2{
  padding:11px 26px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:700;transition:all .15s;
}
.mbtn2.p{background:linear-gradient(135deg,#5b7cff,#a56dff);color:#fff}
.mbtn2.p:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(91,124,255,.4)}
.mbtn2.s{background:#22263a;color:#9195b0;border:1px solid rgba(255,255,255,.07)}
.mbtn2.s:hover{color:#e8eaf6}

/* flash */
@keyframes fR{0%{background:rgba(255,79,94,.25)}100%{background:transparent}}
@keyframes fG{0%{background:rgba(34,197,94,.25)}100%{background:transparent}}
.fr{animation:fR .5s ease}
.fg{animation:fG .5s ease}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0f1117}
::-webkit-scrollbar-thumb{background:#22263a;border-radius:3px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <span class="hdr-mine">💣</span>
  <span class="hdr-title">지뢰찾기</span>
</div>

<!-- ── MENU SCREEN ── -->
<div id="screen-menu">
  <div class="cards">

    <div class="card">
      <div class="card-icon">🎯</div>
      <h2>일반 모드</h2>
      <p>제한 시간 없이 클리어하세요</p>
      <button class="mbtn" onclick="startGame('normal','easy')">
        <span class="mn">초급</span><span class="mi">9×9 · 지뢰 10</span>
      </button>
      <button class="mbtn" onclick="startGame('normal','medium')">
        <span class="mn">중급</span><span class="mi">16×16 · 지뢰 40</span>
      </button>
      <button class="mbtn" onclick="startGame('normal','hard')">
        <span class="mn">상급</span><span class="mi">30×16 · 지뢰 99</span>
      </button>
    </div>

    <div class="card ta">
      <div class="card-icon">⚡</div>
      <h2>타임어택</h2>
      <p>제한 시간 안에 클리어하세요!</p>
      <button class="mbtn ta" onclick="startGame('ta','easy')">
        <span class="mn">초급</span><span class="mi">9×9 · 지뢰 10 · <b>10초</b></span>
      </button>
      <button class="mbtn ta" onclick="startGame('ta','medium')">
        <span class="mn">중급</span><span class="mi">16×16 · 지뢰 40 · <b>40초</b></span>
      </button>
      <button class="mbtn ta" onclick="startGame('ta','hard')">
        <span class="mn">상급</span><span class="mi">30×16 · 지뢰 99 · <b>100초</b></span>
      </button>
    </div>

  </div>
</div>

<!-- ── GAME SCREEN ── -->
<div id="screen-game">

  <div class="topbar">
    <div class="tb-l">
      <button class="back-btn" onclick="goMenu()">← 메뉴</button>
      <span class="badge" id="badge">-</span>
    </div>
    <div class="tb-c">
      <div class="sbox"><span>💣</span><span class="sval" id="mDisp">0</span></div>
      <button class="face" id="faceBtn" onclick="restartGame()">😊</button>
      <div class="sbox" id="timerBox">
        <span>⏱</span><span class="sval tval" id="tDisp">0</span>
      </div>
    </div>
    <div class="tb-r">
      <button class="hbtn" onclick="useHint()">
        💡 힌트 <span class="hpen" id="hpen"></span>
      </button>
    </div>
  </div>

  <div class="tabar" id="tabar">
    <span class="ta-lbl">남은 시간</span>
    <div class="ta-track"><div class="ta-fill" id="taFill"></div></div>
    <span class="ta-sec" id="taSec">0</span>
  </div>

  <div class="bscroll">
    <div class="bouter">
      <div id="board"></div>
    </div>
  </div>

  <div class="ftip">
    💡 <b>화음</b>: 숫자 칸 주변 깃발 수 = 숫자이면 <b>좌클릭 한 번</b>으로 나머지 칸이 열립니다
    &nbsp;|&nbsp; 🚩 우클릭으로 깃발
  </div>
</div>

<!-- ── RESULT MODAL ── -->
<div class="modal" id="modal">
  <div class="mbox">
    <div class="moji" id="moji">🎉</div>
    <div class="mtitle" id="mtitle">클리어!</div>
    <div class="msub" id="msub"></div>
    <div class="mstats">
      <div class="ms"><span class="mslbl">시간</span><span class="msval" id="mtime">-</span></div>
      <div class="ms"><span class="mslbl">힌트 사용</span><span class="msval" id="mhints">-</span></div>
    </div>
    <div class="mbtns">
      <button class="mbtn2 p" onclick="restartGame();closeModal()">다시 도전</button>
      <button class="mbtn2 s" onclick="goMenu();closeModal()">메뉴로</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════
var CFG = {
  easy:   {rows:9,  cols:9,  mines:10},
  medium: {rows:16, cols:16, mines:40},
  hard:   {rows:16, cols:30, mines:99}
};
var TLIMIT = {easy:10, medium:40, hard:100};
var NC = ['','n1','n2','n3','n4','n5','n6','n7','n8'];

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
var G = {
  mode:'normal', level:'easy',
  rows:0, cols:0, totalMines:0,
  grid:null,          // flat array, index = r*cols+c
  status:'idle',      // idle|playing|won|lost
  first:true,
  elapsed:0,
  remaining:0,
  timeLimit:0,
  flagCount:0,
  hintCount:0,
  ticker:null
};

// ════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════
function gi(r,c){ return r*G.cols+c; }

function inBounds(r,c){ return r>=0&&r<G.rows&&c>=0&&c<G.cols; }

function neighbors(r,c,fn){
  for(var dr=-1;dr<=1;dr++)
    for(var dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0) continue;
      var nr=r+dr, nc=c+dc;
      if(inBounds(nr,nc)) fn(nr,nc);
    }
}

function $(id){ return document.getElementById(id); }

function cellDiv(r,c){
  return $('board').childNodes[gi(r,c)] || null;
}

// ════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════
function goMenu(){
  stopTicker();
  $('screen-menu').style.display='';
  $('screen-game').style.display='none';
}

function closeModal(){
  $('modal').className='modal';
}

// ════════════════════════════════════════════════
//  START GAME
// ════════════════════════════════════════════════
function startGame(mode, level){
  stopTicker();

  var cfg = CFG[level];
  G.mode       = mode;
  G.level      = level;
  G.rows       = cfg.rows;
  G.cols       = cfg.cols;
  G.totalMines = cfg.mines;
  G.status     = 'idle';
  G.first      = true;
  G.elapsed    = 0;
  G.remaining  = (mode==='ta') ? TLIMIT[level] : 0;
  G.timeLimit  = TLIMIT[level];
  G.flagCount  = 0;
  G.hintCount  = 0;
  G.ticker     = null;

  // build flat grid
  G.grid = [];
  var total = G.rows * G.cols;
  for(var i=0;i<total;i++){
    G.grid[i] = {mine:false, revealed:false, flagged:false, adj:0};
  }

  // show game screen
  $('screen-menu').style.display='none';
  $('screen-game').style.display='flex';
  $('modal').className='modal';

  // badge & hint label
  var lv = {easy:'초급',medium:'중급',hard:'상급'};
  var ml = (mode==='ta') ? '⚡ 타임어택' : '🎯 일반';
  $('badge').textContent = ml+' · '+lv[level];
  $('hpen').textContent  = (mode==='ta') ? '(-10초)' : '(+10초)';

  // timer vs TA bar
  if(mode==='ta'){
    $('timerBox').style.display='none';
    $('tabar').style.display='flex';
    refreshTA();
  } else {
    $('timerBox').style.display='';
    $('tabar').style.display='none';
    $('tDisp').textContent='0';
  }

  $('faceBtn').textContent='😊';
  refreshMines();
  buildBoard();
}

function restartGame(){
  startGame(G.mode, G.level);
}

// ════════════════════════════════════════════════
//  BUILD BOARD DOM
// ════════════════════════════════════════════════
function buildBoard(){
  var board = $('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = 'repeat('+G.cols+', 36px)';
  board.style.display = 'grid';
  board.style.gap = '3px';

  var total = G.rows*G.cols;
  for(var i=0;i<total;i++){
    var div = document.createElement('div');
    div.className = 'cell cov';
    div.setAttribute('data-i', i);
    board.appendChild(div);
  }
}

// single event delegation on board
$('board').addEventListener('click', function(e){
  var div = e.target;
  if(!div.hasAttribute('data-i')) return;
  var idx = parseInt(div.getAttribute('data-i'),10);
  var r = Math.floor(idx/G.cols);
  var c = idx % G.cols;
  onLeft(r,c);
});

$('board').addEventListener('contextmenu', function(e){
  e.preventDefault();
  var div = e.target;
  if(!div.hasAttribute('data-i')) return;
  var idx = parseInt(div.getAttribute('data-i'),10);
  var r = Math.floor(idx/G.cols);
  var c = idx % G.cols;
  onRight(r,c);
});

// chord hover
$('board').addEventListener('mouseover', function(e){
  var div = e.target;
  if(!div.hasAttribute('data-i')) return;
  var idx = parseInt(div.getAttribute('data-i'),10);
  var r = Math.floor(idx/G.cols);
  var c = idx % G.cols;
  if(!G.grid) return;
  var cell = G.grid[idx];
  if(!cell||!cell.revealed||cell.adj===0) return;
  var flags=0;
  neighbors(r,c,function(nr,nc){ if(G.grid[gi(nr,nc)].flagged) flags++; });
  if(flags===cell.adj) div.classList.add('chord');
});

$('board').addEventListener('mouseout', function(e){
  var div = e.target;
  if(div&&div.classList) div.classList.remove('chord');
});

// ════════════════════════════════════════════════
//  PLACE MINES (after first click)
// ════════════════════════════════════════════════
function placeMines(safeR, safeC){
  // mark safe zone
  var safe = {};
  neighbors(safeR, safeC, function(nr,nc){ safe[gi(nr,nc)]=true; });
  safe[gi(safeR,safeC)] = true;

  // pool of available positions
  var pool=[];
  for(var i=0;i<G.grid.length;i++){
    if(!safe[i]) pool.push(i);
  }

  // Fisher-Yates shuffle
  for(var j=pool.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var tmp=pool[j]; pool[j]=pool[k]; pool[k]=tmp;
  }

  // plant mines
  for(var m=0;m<G.totalMines;m++){
    G.grid[pool[m]].mine=true;
  }

  // compute adj counts
  for(var r=0;r<G.rows;r++){
    for(var c=0;c<G.cols;c++){
      if(!G.grid[gi(r,c)].mine){
        var n=0;
        neighbors(r,c,function(nr,nc){ if(G.grid[gi(nr,nc)].mine) n++; });
        G.grid[gi(r,c)].adj=n;
      }
    }
  }
}

// ════════════════════════════════════════════════
//  CLICK HANDLERS
// ════════════════════════════════════════════════
function onLeft(r,c){
  if(G.status==='won'||G.status==='lost') return;
  var cell=G.grid[gi(r,c)];
  if(cell.flagged) return;

  if(G.first){
    G.first=false;
    G.status='playing';
    placeMines(r,c);
    startTicker();
  }

  if(cell.revealed){
    tryChord(r,c);
    return;
  }

  reveal(r,c,false);
  checkWin();
}

function onRight(r,c){
  if(G.status==='won'||G.status==='lost') return;
  if(G.status==='idle') return;
  var cell=G.grid[gi(r,c)];
  if(cell.revealed) return;
  cell.flagged=!cell.flagged;
  G.flagCount += cell.flagged ? 1 : -1;
  paint(r,c,false);
  refreshMines();
}

// ════════════════════════════════════════════════
//  CHORD
// ════════════════════════════════════════════════
function tryChord(r,c){
  var cell=G.grid[gi(r,c)];
  if(!cell.revealed||cell.adj===0) return;
  var flags=0;
  neighbors(r,c,function(nr,nc){ if(G.grid[gi(nr,nc)].flagged) flags++; });
  if(flags!==cell.adj) return;

  var hitMine=false;
  var toOpen=[];
  neighbors(r,c,function(nr,nc){
    var nb=G.grid[gi(nr,nc)];
    if(!nb.revealed&&!nb.flagged) toOpen.push([nr,nc]);
  });

  for(var i=0;i<toOpen.length;i++){
    var nr=toOpen[i][0], nc=toOpen[i][1];
    var nb=G.grid[gi(nr,nc)];
    if(nb.mine){
      hitMine=true;
      nb.revealed=true;
      var div=cellDiv(nr,nc);
      if(div){ div.className='cell boom'; div.textContent='💣'; }
    } else {
      reveal(nr,nc,true);
    }
  }

  if(hitMine) endGame(false); else checkWin();
}

// ════════════════════════════════════════════════
//  REVEAL (flood fill)
// ════════════════════════════════════════════════
function reveal(r,c,anim){
  var cell=G.grid[gi(r,c)];
  if(cell.revealed||cell.flagged) return;
  cell.revealed=true;

  if(cell.mine){
    var div=cellDiv(r,c);
    if(div){ div.className='cell boom'; div.textContent='💣'; }
    endGame(false);
    return;
  }

  paint(r,c,anim);

  if(cell.adj===0){
    neighbors(r,c,function(nr,nc){ reveal(nr,nc,false); });
  }
}

// ════════════════════════════════════════════════
//  PAINT CELL
// ════════════════════════════════════════════════
function paint(r,c,anim){
  var cell=G.grid[gi(r,c)];
  var div=cellDiv(r,c);
  if(!div) return;

  if(cell.revealed){
    var cls='cell open';
    if(anim) cls+=' cpop';
    if(cell.adj>0) cls+=' '+NC[cell.adj];
    div.className=cls;
    div.textContent=cell.adj>0 ? cell.adj : '';
  } else if(cell.flagged){
    div.className='cell flag';
    div.textContent='🚩';
  } else {
    div.className='cell cov';
    div.textContent='';
  }
}

// ════════════════════════════════════════════════
//  WIN CHECK
// ════════════════════════════════════════════════
function checkWin(){
  for(var i=0;i<G.grid.length;i++){
    var c=G.grid[i];
    if(!c.mine&&!c.revealed) return;
  }
  endGame(true);
}

// ════════════════════════════════════════════════
//  END GAME
// ════════════════════════════════════════════════
function endGame(won){
  stopTicker();
  G.status=won?'won':'lost';
  $('faceBtn').textContent=won?'😎':'😵';

  if(!won){
    for(var r=0;r<G.rows;r++)
      for(var c=0;c<G.cols;c++){
        var cell=G.grid[gi(r,c)];
        if(cell.mine&&!cell.flagged&&!cell.revealed){
          var div=cellDiv(r,c);
          if(div){ div.className='cell mshow'; div.textContent='💣'; }
        }
      }
  }

  setTimeout(showResult, won?600:900);
}

function showResult(){
  var lv={easy:'초급',medium:'중급',hard:'상급'};
  var emoji,title,sub;

  if(G.status==='won'){
    emoji='🎉'; title='클리어!';
    sub=(G.mode==='ta')
      ? '타임어택 성공! '+G.remaining+'초 남았습니다.'
      : lv[G.level]+' 모드 클리어!';
  } else if(G.mode==='ta'&&G.remaining<=0){
    emoji='⏰'; title='시간 초과!';
    sub='제한 시간 안에 클리어하지 못했습니다.';
  } else {
    emoji='💥'; title='지뢰 폭발!';
    sub='지뢰를 밟았습니다. 다시 도전해보세요!';
  }

  $('moji').textContent  = emoji;
  $('mtitle').textContent = title;
  $('msub').textContent   = sub;

  var elapsed = (G.mode==='ta') ? (G.timeLimit-G.remaining) : G.elapsed;
  $('mtime').textContent  = elapsed+'초';
  $('mhints').textContent = G.hintCount+'회';

  $('modal').className='modal show';
}

// ════════════════════════════════════════════════
//  HINT
// ════════════════════════════════════════════════
function useHint(){
  if(G.status!=='playing') return;

  var seen={}, cands=[];
  for(var r=0;r<G.rows;r++){
    for(var c=0;c<G.cols;c++){
      if(!G.grid[gi(r,c)].revealed) continue;
      neighbors(r,c,function(nr,nc){
        var k=gi(nr,nc);
        var nb=G.grid[k];
        if(!seen[k]&&!nb.revealed&&!nb.flagged&&!nb.mine){
          seen[k]=true; cands.push([nr,nc]);
        }
      });
    }
  }
  if(cands.length===0) return;

  var pick=cands[Math.floor(Math.random()*cands.length)];
  var hr=pick[0], hc=pick[1];

  G.hintCount++;
  reveal(hr,hc,false);

  var hdiv=cellDiv(hr,hc);
  if(hdiv){
    hdiv.classList.add('hglow');
    setTimeout(function(){ if(hdiv) hdiv.classList.remove('hglow'); },700);
  }

  if(G.mode==='normal'){
    G.elapsed+=10;
    $('tDisp').textContent=G.elapsed;
    flash($('timerBox'),'fg');
  } else {
    G.remaining=Math.max(0,G.remaining-10);
    refreshTA();
    flash($('tabar'),'fr');
    if(G.remaining<=0){ endGame(false); return; }
  }

  checkWin();
}

// ════════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════════
function startTicker(){
  stopTicker();
  G.ticker=setInterval(function(){
    if(G.mode==='normal'){
      G.elapsed++;
      $('tDisp').textContent=G.elapsed;
    } else {
      G.remaining--;
      refreshTA();
      if(G.remaining<=0){
        G.remaining=0;
        refreshTA();
        endGame(false);
      }
    }
  },1000);
}

function stopTicker(){
  if(G.ticker){ clearInterval(G.ticker); G.ticker=null; }
}

function refreshTA(){
  var pct=G.timeLimit>0 ? G.remaining/G.timeLimit : 0;
  $('taFill').style.width=Math.round(pct*100)+'%';
  $('taSec').textContent=G.remaining;
  var fill=$('taFill');
  fill.className='ta-fill'+(pct<=0.25?' d':pct<=0.5?' w':'');
}

function refreshMines(){
  $('mDisp').textContent=G.totalMines-G.flagCount;
}

function flash(el,cls){
  if(!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(function(){ if(el) el.classList.remove(cls); },600);
}
</script>
